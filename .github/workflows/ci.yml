name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a dependency that breaks us in a release we didn't ask for is
    # caught here rather than by the next person to run pip install. The mcp
    # 1.x -> 2.x rename shipped between pushes and went unnoticed exactly
    # because nothing re-ran the suite in the meantime.
    - cron: "0 6 * * 1"

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The auto-spawn / terminal features target Windows, so keep one
          # Windows leg in the matrix.
          - os: windows-latest
            python-version: "3.12"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: pytest -v

      - name: Self-check
        run: claude-team-mcp doctor

  sdk-compat:
    # The server supports both mcp SDK lines through a compatibility shim.
    # Pin each one explicitly so a break in either is attributable, instead of
    # depending on whatever the resolver happens to pick that day.
    name: pytest (mcp ${{ matrix.mcp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["<2", ">=2"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with pinned mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "mcp${{ matrix.mcp }}"
      - name: Show which API the shim selected
        run: python -c "import team_coordinator as t; print(t._MCP_API)"
      - name: Run tests
        run: pytest -v

  package:
    name: build sdist/wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check entry point resolves
        run: |
          pip install dist/*.whl
          python -c "import team_coordinator; assert callable(team_coordinator.main)"
