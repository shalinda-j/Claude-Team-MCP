# GitLab CI/CD pipeline — runs the project's full test suite, both mcp SDK
# lines, the package build, and the container image on GitLab (gitlab.com or
# self-hosted). It now covers the same ground as .github/workflows/ci.yml.
# See examples/gitlab_setup.md for how to connect the repo.

stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUTF8: "1"

default:
  # A second push makes the first pipeline's result irrelevant; let GitLab
  # cancel it rather than running two full matrices.
  interruptible: true
  timeout: 20m
  cache:
    # CI_JOB_NAME carries the matrix value, so each Python version caches
    # separately instead of thrashing one shared entry.
    key: "pip-$CI_JOB_NAME"
    paths:
      - .cache/pip

# The same three conditions were repeated on every job. One definition means a
# new job cannot quietly get a different trigger policy.
.default_rules: &default_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

test:
  stage: test
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  before_script:
    - python -m pip install --upgrade pip
    # Quoted: [dev] is a glob pattern to sh, and an unquoted extras spec is one
    # stray matching file away from resolving to something else.
    - pip install -e ".[dev]"
  script:
    - pytest -v
    - claude-team-mcp doctor
  <<: *default_rules

sdk-compat:
  # The server supports both mcp SDK lines through a compatibility shim. Pin
  # each explicitly so a break in either is attributable, rather than depending
  # on whatever the resolver happens to pick that day. This was GitHub-only;
  # the two pipelines now agree.
  stage: test
  image: python:3.12
  parallel:
    matrix:
      - MCP_SPEC: ["<2", ">=2"]
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - pip install "mcp${MCP_SPEC}"
  script:
    - python -c "import team_coordinator as t; print(t._MCP_API)"
    - pytest -v
  <<: *default_rules

package:
  stage: build
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip build
  script:
    - python -m build
    - pip install dist/*.whl
    - python -c "import team_coordinator; assert callable(team_coordinator.main)"
    - claude-team-mcp doctor
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  <<: *default_rules

docker:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  cache: []          # nothing here uses the pip cache
  script:
    - docker build -t claude-team-mcp:ci .
    # doctor exits non-zero on a broken environment, so this proves the image
    # is functional, not merely built.
    - docker run --rm claude-team-mcp:ci doctor
    - |
      uid=$(docker run --rm --entrypoint id claude-team-mcp:ci -u)
      test "$uid" != "0" || { echo "image runs as root"; exit 1; }
      echo "uid=$uid"
  <<: *default_rules
